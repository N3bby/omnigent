---
- name: Install host prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - nftables
      - openssl
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the public-interface firewall rules
  ansible.builtin.template:
    src: omnigent-firewall.nft.j2
    dest: /etc/omnigent-firewall.nft
    owner: root
    group: root
    mode: "0600"
  notify: Restart omnigent firewall

- name: Install the firewall service
  ansible.builtin.template:
    src: omnigent-firewall.service.j2
    dest: /etc/systemd/system/omnigent-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart omnigent firewall

- name: Enable the firewall
  ansible.builtin.systemd_service:
    name: omnigent-firewall.service
    enabled: true
    state: started
    daemon_reload: true

