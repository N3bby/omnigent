---
- name: Diff Omnigent desired state
  hosts: all
  become: true
  gather_facts: false
  vars:
    rendered_manifest: "{{ playbook_dir | dirname }}/.generated/{{ omnigent_environment }}/manifest.yaml"
  tasks:
    - name: Ensure a manifest has been rendered locally
      ansible.builtin.assert:
        that: rendered_manifest is file
        fail_msg: "Run ENV={{ omnigent_environment }} mise run render first."
      delegate_to: localhost
      become: false
    - name: Copy manifest for a dry-run diff
      ansible.builtin.copy:
        src: "{{ rendered_manifest }}"
        dest: /tmp/omnigent-manifest.yaml
        owner: root
        group: root
        mode: "0600"
    - name: Check whether the managed namespaces exist
      ansible.builtin.command:
        argv: [k3s, kubectl, get, namespace, omnigent, omnigent-sandboxes]
      register: managed_namespaces
      changed_when: false
      failed_when: false
    - name: Show server-side diff
      ansible.builtin.command:
        argv: [k3s, kubectl, diff, --server-side=true, --force-conflicts, --field-manager=omnigent-deployment, -f, /tmp/omnigent-manifest.yaml]
      register: manifest_diff
      changed_when: manifest_diff.rc == 1
      failed_when: manifest_diff.rc not in [0, 1]
      when: managed_namespaces.rc == 0
    - name: Print manifest diff
      ansible.builtin.debug:
        var: manifest_diff.stdout_lines
      when: managed_namespaces.rc == 0
    - name: Explain fresh-install diff
      ansible.builtin.debug:
        msg: >-
          One or both managed namespaces do not exist. Kubernetes cannot
          server-diff their child objects yet; the first deployment will create
          the complete rendered manifest.
      when: managed_namespaces.rc != 0
    - name: Remove temporary manifest
      ansible.builtin.file:
        path: /tmp/omnigent-manifest.yaml
        state: absent
      changed_when: false
