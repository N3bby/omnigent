---
- name: Smoke-test Omnigent
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run smoke tests
      ansible.builtin.command: /usr/local/libexec/omnigent/smoke-test
      register: smoke_result
      changed_when: false
    - name: Show smoke-test result
      ansible.builtin.debug:
        var: smoke_result.stdout_lines
