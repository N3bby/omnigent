name: Publish immutable images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read locked build versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1: \"\(.*\)\"$/\1/p" versions.yaml; }
          echo "release=$(value image_release)" >> "$GITHUB_OUTPUT"
          echo "host_digest=$(value omnigent_host_base_digest)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: images/runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omnigent-runner:${{ steps.versions.outputs.release }}
          build-args: |
            OMNIGENT_HOST_IMAGE=ghcr.io/omnigent-ai/omnigent-host@${{ steps.versions.outputs.host_digest }}
          provenance: mode=max
          sbom: true
      - name: Scan the published digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/omnigent-runner@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Record digest
        run: echo 'runner=${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
