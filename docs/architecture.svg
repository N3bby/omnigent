<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1280 692" width="1280" height="692" role="img" aria-labelledby="t d">
  <title id="t">Omnigent deployment overview</title>
  <desc id="d">The Deploy workflow in GitHub Actions builds images for your fork, commits their digests, and deploys them over Tailscale through the Kubernetes API of a single Ubuntu VM running k3s. mise run bootstrap sets up the VM itself over SSH. Traefik serves HTTPS to the Omnigent server, which stores data in PostgreSQL and Vault and starts one runner pod per session. Runner pods call the model APIs and GitHub.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .vm { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
    .ns { fill: #ffffff; fill-opacity: .55; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .accent { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .store { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .edge { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .line { fill: none; stroke: #475569; stroke-width: 1.6; }
    .head { fill: #475569; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: .06em; fill: #475569; }
    .title { font-size: 15px; font-weight: 650; }
    .sub { font-size: 12.5px; fill: #475569; }
    .lbl { font-size: 11.5px; fill: #475569; }
    .nslbl { font-size: 11.5px; fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .card, .ext { fill: #1e293b; stroke: #475569; }
      .vm { fill: #111c2e; stroke: #94a3b8; }
      .ns { fill: #1e293b; fill-opacity: .45; stroke: #475569; }
      .accent { fill: #1e3a8a; stroke: #60a5fa; }
      .store { fill: #422006; stroke: #f59e0b; }
      .edge { fill: #052e2b; stroke: #34d399; }
      .line { stroke: #94a3b8; }
      .head { fill: #94a3b8; }
      text { fill: #e2e8f0; }
      .h, .sub, .lbl { fill: #94a3b8; }
      .nslbl { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" y="40" width="1280" height="692" rx="16"/>

  <!-- Left column: build and deploy -->
  <text class="h" x="32" y="100">BUILD &amp; DEPLOY</text>

  <rect class="ext" x="32" y="116" width="260" height="64" rx="10"/>
  <text class="title" x="48" y="142">Your fork of this repo</text>
  <text class="sub" x="48" y="162">config, versions, manifests</text>

  <rect class="ext" x="32" y="228" width="260" height="64" rx="10"/>
  <text class="title" x="48" y="254">GitHub Actions · Deploy</text>
  <text class="sub" x="48" y="274">builds, locks digests, deploys</text>

  <rect class="ext" x="32" y="334" width="260" height="64" rx="10"/>
  <text class="title" x="48" y="360">GHCR</text>
  <text class="sub" x="48" y="380">public images, pinned by digest</text>

  <rect class="card" x="32" y="470" width="260" height="64" rx="10"/>
  <text class="title mono" x="48" y="496">mise run bootstrap</text>
  <text class="sub" x="48" y="516">from your clone: k3s, platform</text>

  <path class="line" d="M92 180 V226" marker-end="url(#a)"/>
  <text class="lbl" x="100" y="208">checkout</text>
  <path class="line" d="M192 226 V182" marker-end="url(#a)"/>
  <text class="lbl" x="200" y="208">commit digests</text>
  <path class="line" d="M162 292 V332" marker-end="url(#a)"/>
  <text class="lbl" x="172" y="316">push images</text>

  <path class="line" d="M292 366 H350" marker-end="url(#a)"/>
  <text class="lbl" x="321" y="358" text-anchor="middle">pull</text>
  <path class="line" d="M292 502 H350" marker-end="url(#a)"/>
  <text class="lbl" x="321" y="494" text-anchor="middle">SSH</text>
  <text class="lbl" x="321" y="518" text-anchor="middle">sudo</text>

  <path class="line" d="M292 260 H350" marker-end="url(#a)"/>
  <text class="lbl" x="321" y="252" text-anchor="middle">k8s API</text>
  <text class="lbl" x="321" y="276" text-anchor="middle">Tailscale</text>

  <!-- Middle: the VM -->
  <rect class="vm" x="352" y="72" width="576" height="628" rx="14"/>
  <text class="h" x="372" y="100">YOUR UBUNTU VM · K3S</text>

  <rect class="edge" x="384" y="120" width="512" height="56" rx="10"/>
  <text class="title" x="404" y="144">Traefik + cert-manager</text>
  <text class="sub" x="404" y="163">HTTPS with automatic Let's Encrypt certificates</text>

  <rect class="ns" x="376" y="200" width="528" height="192" rx="10"/>
  <text class="nslbl" x="890" y="219" text-anchor="end">namespace omnigent</text>

  <rect class="accent" x="400" y="274" width="248" height="72" rx="10"/>
  <text class="title" x="418" y="302">Omnigent server</text>
  <text class="sub" x="418" y="323">web UI, API, sessions</text>

  <rect class="store" x="688" y="238" width="192" height="60" rx="10"/>
  <text class="title" x="706" y="263">PostgreSQL</text>
  <text class="sub" x="706" y="283">accounts and history</text>

  <rect class="store" x="688" y="316" width="192" height="60" rx="10"/>
  <text class="title" x="706" y="341">Vault</text>
  <text class="sub" x="706" y="361">encrypts GitHub tokens</text>

  <path class="line" d="M648 296 H686" marker-end="url(#a)"/>
  <path class="line" d="M648 330 C668 330 668 346 686 346" marker-end="url(#a)"/>

  <path class="line" d="M600 176 V272" marker-end="url(#a)"/>

  <rect class="ns" x="376" y="416" width="528" height="264" rx="10"/>
  <text class="nslbl" x="890" y="435" text-anchor="end">namespace omnigent-sandboxes</text>

  <rect class="card" x="424" y="488" width="448" height="124" rx="10"/>
  <rect class="card" x="416" y="480" width="448" height="124" rx="10"/>
  <rect class="accent" x="408" y="472" width="448" height="124" rx="10"/>
  <text class="title" x="428" y="500">Runner pod, one per session</text>
  <text class="sub" x="428" y="522">Claude Code or Codex, working in a checkout of your repo</text>
  <text class="sub" x="428" y="542">root inside the pod only: maps to an unprivileged host user</text>
  <text class="sub" x="428" y="562">Podman for containers, apt-get for packages</text>
  <text class="sub" x="428" y="582">uses the shared agent logins you set up</text>

  <text class="lbl" x="408" y="648">CPU, memory and disk limits per pod · unrestricted network</text>

  <path class="line" d="M470 346 V470" marker-end="url(#a)"/>
  <text class="lbl" x="478" y="409">starts pod</text>
  <path class="line" d="M580 472 V348" marker-end="url(#a)"/>
  <text class="lbl" x="588" y="409">connects back</text>

  <!-- Right column: people and services -->
  <text class="h" x="988" y="100">USERS &amp; SERVICES</text>

  <rect class="ext" x="988" y="116" width="260" height="64" rx="10"/>
  <text class="title" x="1004" y="142">You and your team</text>
  <text class="sub" x="1004" y="162">browser, desktop, mobile app</text>
  <path class="line" d="M986 148 H898" marker-end="url(#a)"/>
  <text class="lbl" x="958" y="140" text-anchor="middle">HTTPS</text>

  <rect class="ext" x="988" y="468" width="260" height="64" rx="10"/>
  <text class="title" x="1004" y="494">Anthropic and OpenAI</text>
  <text class="sub" x="1004" y="514">model APIs</text>

  <rect class="ext" x="988" y="556" width="260" height="64" rx="10"/>
  <text class="title" x="1004" y="582">GitHub</text>
  <text class="sub" x="1004" y="602">clone, push, pull requests</text>

  <path class="line" d="M878 500 H986" marker-end="url(#a)"/>
  <path class="line" d="M878 588 H986" marker-end="url(#a)"/>
</svg>
