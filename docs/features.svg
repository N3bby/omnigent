  <rect class="bg" width="1466" height="752" rx="16"/>

  <text class="hero" x="48" y="72">What N3bby/omnigent does</text>
  <text class="lede" x="48" y="104">Every session gets its own (remote) sandboxed machine running Claude Code or Codex.</text>

  <!-- Every box: first baseline 30px below the top, 24px between title and text,
       last baseline 20px above the bottom, text inset 20px. -->

  <!-- You -->
  <rect class="ext" x="48" y="349" width="220" height="74" rx="12"/>
  <text class="title" x="68" y="379">You</text>
  <text class="sub" x="68" y="403">browser, desktop or phone</text>

  <!-- Omnigent UI -->
  <rect class="card" x="518" y="160" width="460" height="122" rx="12"/>
  <text class="title" x="538" y="190">Omnigent UI <tspan font-size="14" font-weight="400" fill="#64748b">with custom features</tspan></text>
  <text class="sub" x="538" y="214"><tspan class="tick">✓ </tspan> View Claude and Codex usage limits</text>
  <text class="sub" x="538" y="238"><tspan class="gwtick">✓ </tspan></text>
  <use href="#ts" x="557" y="227" width="14" height="14"/>
  <text class="sub" x="576" y="238"><tspan fill="#6d28d9" font-weight="600">Copy pod Tailscale address</tspan></text>
  <text class="sub" x="538" y="262"><tspan class="gwtick">✓ </tspan></text>
  <use href="#gw" x="556" y="249" width="16" height="16" fill="#7c3aed"/>
  <text class="sub" x="576" y="262"><tspan fill="#6d28d9" font-weight="600">Open in Gateway</tspan> button on desktop</text>

  <path class="line" d="M158 347 V221 H516" marker-end="url(#a)"/>
  <text class="lbl" x="200" y="213">Chat with your agents</text>

  <!-- Session pod -->
  <rect class="card" x="534" y="378" width="460" height="152" rx="12"/>
  <rect class="card" x="526" y="370" width="460" height="152" rx="12"/>
  <rect class="accent" x="518" y="362" width="460" height="152" rx="12"/>
  <text class="title" x="538" y="392">A fresh agent-sandbox k8s pod for every session</text>
  <text class="sub" x="538" y="416">Checks out your repo and starts an agent harness</text>
  <text class="sub" x="538" y="446"><tspan class="tick">✓ </tspan> Root inside: agents can install anything</text>
  <text class="sub" x="538" y="470"><tspan class="tick">✓ </tspan> Common tooling pre-installed (Docker, mise, ...)</text>
  <text class="sub" x="538" y="494"><tspan class="tick">✓ </tspan> Dynamically allocates/frees resources from the host</text>

  <path class="line" d="M748 282 V360" marker-end="url(#a)"/>
  <text class="lbl" x="758" y="325">Starts on new session</text>

  <!-- Tailscale: you straight into the pod -->
  <path class="gwline" d="M270 386 H516" marker-end="url(#p)"/>
  <use href="#ts" x="290" y="362" width="14" height="14"/>
  <text class="gwlbl" x="312" y="374">Tailscale</text>
  <text class="gwsub" x="290" y="408">SSH to pod &amp; interact</text>
  <text class="gwsub" x="290" y="426">with dev servers or</text>
  <text class="gwsub" x="290" y="444">running services</text>

  <!-- Open in Gateway: from you, by Tailscale SSH, into the pod -->
  <path class="gwline" d="M158 425 V490 H516" marker-end="url(#p)"/>
  <use href="#gw" x="176" y="464" width="18" height="18" fill="#7c3aed"/>
  <text class="gwlbl" x="200" y="478">Open in Gateway</text>
  <text class="gwsub" x="176" y="514">One click opens the session's</text>
  <text class="gwsub" x="176" y="532">repo in IntelliJ on your computer</text>

  <!-- Home volume -->
  <path class="line" d="M748 530 V630"/>
  <text class="lbl" x="758" y="572">Pod sleeps after a configurable time to save resources.</text>
  <text class="lbl" x="758" y="590">New messages wake it again.</text>
  <rect class="store" x="518" y="630" width="460" height="74" rx="12"/>
  <text class="title" x="538" y="660">Permanent file system</text>
  <text class="sub" x="538" y="684">Kept until you delete the session</text>

  <!-- Services -->
  <rect class="ext" x="1090" y="342" width="328" height="74" rx="12"/>
  <use href="#github" x="1110" y="357" width="20" height="20" fill="#0f172a"/>
  <text class="title" x="1140" y="372">GitHub</text>
  <text class="sub" x="1110" y="396">Clone, pull, push, PRs, issues</text>

  <rect class="ext" x="1090" y="440" width="328" height="94" rx="12"/>
  <use href="#claude" x="1110" y="455" width="20" height="20" fill="#d97757"/>
  <use href="#openai" x="1136" y="455" width="20" height="20" fill="#0f172a"/>
  <text class="title" x="1166" y="470">Claude Code and Codex CLI</text>
  <text class="sub" x="1110" y="494">Omnigent uses your subscriptions</text>
  <text class="sub" x="1110" y="514">through the first-party CLIs</text>

  <path class="line" d="M996 438 H1043"/>
  <path class="line" d="M1043 438 V379 H1088" marker-end="url(#a)"/>
  <path class="line" d="M1043 438 V487 H1088" marker-end="url(#a)"/>
