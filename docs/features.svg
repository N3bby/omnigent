<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1466 752" width="1466" height="752" role="img" aria-labelledby="t d">
  <title id="t">What N3bby/omnigent does</title>
  <desc id="d">You use the Omnigent UI, which adds usage limits, a button to copy the pod's Tailscale address and an Open in Gateway button. A new session starts a fresh agent-sandbox Kubernetes pod that checks out your repo and starts an agent harness; agents are root inside it, have common tooling such as Docker and mise preinstalled, and the pod dynamically allocates and frees resources from the host. The pod works with GitHub and runs Claude Code and the Codex CLI on your subscriptions. From your own devices you reach the pod over Tailscale to SSH in or use its dev servers and services, and Open in Gateway opens the session's repo in IntelliJ in one click. The pod sleeps after a configurable idle time and wakes on a new message, and its file system is kept until you delete the session.</desc>
