apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The platform layer: namespaces, security boundaries, capacity and access.
# `mise run bootstrap` applies it as cluster-admin. The deploy identity cannot
# change any of it.
resources:
  - namespaces.yaml
  - runner-userns.yaml
  - resource-policy.yaml
  - runner-rbac.yaml
  - deployer-rbac.yaml
