# Gives runner Pods /dev/net/tun, so Tailscale in a Pod can route its own
# connections: tailnet names resolve and tailnet addresses connect from any
# tool, and a repository's exit node carries the Pod's internet traffic
# (images/runner/tailscale/tailscale-service.sh). A user namespace can't
# create the device node itself, and the sandbox guard in runner-userns.yaml
# rules out hostPath volumes, so the kubelet adds it for each Pod that asks for
# an omnigent.dev/tun, which runner-userns.yaml does for the host container.
# The device only opens interfaces in the Pod's own network namespace.
# The image is pinned in versions.yaml (tun_device_plugin_digest).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: omnigent-tun-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: omnigent-tun-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnigent-tun-device-plugin
    spec:
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: device-plugin
          image: ghcr.io/squat/generic-device-plugin:0.2.0
          args:
            - --domain=omnigent.dev
            # Far more than runner_max_concurrency: every Pod gets its own
            # node, and the count only limits how many Pods can ask at once.
            - --device
            - '{"name": "tun", "groups": [{"count": 1000, "paths": [{"path": "/dev/net/tun"}]}]}'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev-net
              mountPath: /dev/net
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev-net
          hostPath:
            path: /dev/net
  updateStrategy:
    type: RollingUpdate
