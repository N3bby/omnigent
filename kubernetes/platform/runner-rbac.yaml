apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigent-runner
  namespace: omnigent-sandboxes
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omnigent-sandbox-manager
  namespace: omnigent-sandboxes
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [create, get, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, list, get, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Launch-token Secrets, plus Settings → Repository variables, which lists,
  # reads and replaces the omnigent-repo-env-* Secrets. RBAC can't limit list
  # to those, so the server can read every Secret here.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, list, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-sandbox-manager
  namespace: omnigent-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omnigent-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: omnigent-server
    namespace: omnigent

