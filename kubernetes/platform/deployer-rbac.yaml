# What `mise run deploy` may do when it runs as the GitHub Actions identity.
# The API server maps an accepted GitHub OIDC token to the user below (see the
# k3s role's authentication-config.yaml.j2).
#
# It manages the application layer in the two Omnigent namespaces and nothing
# else. It cannot edit namespaces, admission policies, RBAC, quotas or anything
# cluster-wide, so it cannot loosen the runner boundary or reach the host.
# Being able to run Pods there does give it every Secret in both namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omnigent-deployer
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, serviceaccounts, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log, endpoints]
    verbs: [get]
  - apiGroups: [""]
    resources: [events, limitranges, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-deployer
  namespace: omnigent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omnigent-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: github-actions:deploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-deployer
  namespace: omnigent-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omnigent-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: github-actions:deploy
---
# Read-only node health for `mise run status`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omnigent-deployer-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omnigent-deployer-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omnigent-deployer-nodes
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: github-actions:deploy
