apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigent-artifacts
  namespace: omnigent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-home
  namespace: omnigent-sandboxes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

