apiVersion: v1
kind: Namespace
metadata:
  name: omnigent
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: omnigent-sandboxes
  labels:
    # Runner Pods need capabilities that Pod Security cannot see are confined
    # to their user namespace; runner-userns.yaml enforces the real boundary.
    pod-security.kubernetes.io/enforce: privileged

