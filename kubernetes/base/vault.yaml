apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: omnigent
data:
  vault.hcl: |
    ui = false
    disable_mlock = true
    default_lease_ttl = "87600h"
    max_lease_ttl = "87600h"

    storage "file" {
      path = "/vault/file"
    }

    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = true
    }

    api_addr = "http://vault.omnigent.svc.cluster.local:8200"
  omnigent-transit.hcl: |
    path "transit/encrypt/omnigent-connections" {
      capabilities = ["update"]
    }
    path "transit/decrypt/omnigent-connections" {
      capabilities = ["update"]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: omnigent
spec:
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: credential-encryption
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: omnigent
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: credential-encryption
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/component: credential-encryption
    spec:
      priorityClassName: omnigent-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:2.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              vault server -config=/vault/config/vault.hcl &
              server_pid=$!
              trap 'kill "$server_pid"' TERM INT
              export VAULT_ADDR=http://127.0.0.1:8200
              while kill -0 "$server_pid" 2>/dev/null; do
                set +e
                vault status >/dev/null 2>&1
                status=$?
                set -e
                if [ "$status" -eq 0 ]; then
                  break
                fi
                if [ "$status" -eq 2 ] && [ -n "${VAULT_UNSEAL_KEY:-}" ]; then
                  vault operator unseal "$VAULT_UNSEAL_KEY" >/dev/null 2>&1 || true
                fi
                sleep 1
              done
              wait "$server_pid"
          env:
            - name: VAULT_UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap
                  key: unseal-key
                  optional: true
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: data
              mountPath: /vault/file
      volumes:
        - name: config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
