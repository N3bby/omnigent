[project]
name = "omnigent-mcp"
version = "0.1.0"
description = "An MCP server for an Omnigent deployment's sessions and projects, such as for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.scripts]
omnigent-mcp = "omnigent_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnigent_mcp"]
