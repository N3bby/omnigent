# Non-secret production configuration. Commit this file.
hostname = "omni.n3b.by"
acme_email = "levi.vandenbempt.sjcm@gmail.com"
admin_email = "levi.vandenbempt.sjcm@gmail.com"

# How Let's Encrypt checks that you control hostname. "http-01" fetches a file
# from the VM, so the VM must be reachable from the Internet on port 80.
# "cloudflare-dns-01" looks up a DNS record that cert-manager creates through
# the Cloudflare API, so the VM can be private, such as Tailscale-only; see
# docs/private-deployment.md.
acme_challenge = "cloudflare-dns-01"

# Where kubectl reaches the Kubernetes API. The firewall blocks port 6443 on
# the public interface, so use a private name such as the VM's Tailscale
# MagicDNS name. Defaults to hostname.
kubernetes_api_host = "home-omnigent.taild5bc1b.ts.net"

# Runner Pods join this tailnet as omnigent-<id>, and the composer shows each
# session's name with a copy button. Pods join only once `mise run
# setup-tailscale` stores a key. Remove it to hide the names.
tailscale_tailnet = "taild5bc1b.ts.net"

# Sessions with the Hermes agent hand their turns to the Hermes Agent on this
# machine, over SSH as this user (docs/features/hermes-remote.md). Store the
# key with `mise run setup-hermes-ssh-key`. Remove all three to turn it off.
hermes_remote_ssh_host = "home-hermes.taild5bc1b.ts.net"
hermes_remote_ssh_user = "n3bby"
hermes_remote_ssh_port = 2222
# Hermes sessions start on an always-on host instead of a sandbox each
# (docs/features/hermes-host.md), once `mise run setup-hermes-host` signs it
# in. Set to false to give them sandboxes again.
# hermes_host = true

# Origins allowed to call the API from another site, comma-separated, or "*".
# The Even G2 glasses app runs in the Even app's WebView and needs this; see
# docs/features/even-g2.md. It signs in with a token, not a cookie, so "*"
# doesn't let other sites act as you. Remove it to turn CORS off.
cors_allowed_origins = "*"

# Push-to-talk in the composer streams your voice to this Voxtral Realtime
# server, which your browser reaches over the tailnet; see
# docs/features/push-to-talk.md. Remove it to hide the mic button.
push_to_talk_url = "wss://mac-mini.taild5bc1b.ts.net:8443"

# The GitHub repository (by numeric ID) and Environment whose Actions runs may
# deploy. Remove both to turn off deploying from GitHub Actions.
deploy_github_repository_id = "1386328125"
deploy_github_environment = "production"

# Change this to the public GHCR namespace used by this repository.
image_registry = "ghcr.io/n3bby"
runner_image = "omnigent-runner"
server_image = "omnigent-server"

# Custom image digests are intentionally mandatory. `mise run lock-images`
# resolves the images CI published for the checked-out commit. Upstream build inputs
# and the PostgreSQL/Vault digests live in versions.yaml.
runner_digest = "sha256:8d135207686c41db17163fc60aec7cddd0a64623bc0f3f8d6ee686b6777ba728"
server_digest = "sha256:a83a9481b889e00a816d6dfb29fc67c304cf951db4ff3fe80dd8f49f2a659085"

server_cpu_request = "500m"
# Memory reserved for the server. The server, PostgreSQL and Vault have no
# memory limit; staying within their reservation is what makes the kubelet
# evict runners before them when the VM runs short. Peak usage measured on
# 2026-10-06 with the production images and config, under simulated traffic
# (300 sessions with comments, 16 concurrent users, 20 open session streams,
# 5,000 Vault encrypt/decrypt calls): server ~280 MiB, PostgreSQL ~85 MiB,
# Vault ~170 MiB. No live agent sessions ran, so the server figure is the
# least certain. PostgreSQL and Vault reserve 256Mi in kubernetes/base/.
# Recheck with `./scripts/kube top pods -n omnigent` after a busy day.
server_memory_request = "512Mi"

postgres_storage = "10Gi"
artifact_storage = "10Gi"
codex_storage = "1Gi"

runner_cpu_request = "500m"
runner_memory_request = "1Gi"
runner_ephemeral_request = "2Gi"
# The pinned Omnigent server always sets runner CPU/memory limits. Keep them
# far above node capacity so runners can use whatever the node has free.
runner_cpu_limit = "1000"
runner_memory_limit = "1024Gi"
# The kubelet enforces the ephemeral-storage limit by evicting the Pod, which
# ends its session, so keep it far above the disk too. When the disk runs low,
# the kubelet still evicts the runner using the most beyond its request.
runner_ephemeral_limit = "1024Gi"
# Each session keeps its home directory on a volume of this size until the
# session is deleted. local-path does not enforce the size.
runner_home_limit = "8Gi"
runner_pod_ready_timeout_seconds = 300
runner_max_concurrency = 10
# An idle session's agent exits after runner_agent_idle_seconds. Its Pod
# stops runner_idle_shutdown_seconds after the last agent activity, and starts
# again with its home directory on the next message.
runner_agent_idle_seconds = 1800
runner_idle_shutdown_seconds = 3600

# How long a sign-in lasts, in hours, counted from signing in; using Omnigent
# doesn't extend it. Signing out only clears that device's cookie, so a copied
# cookie works this long. Only deleting the account or changing
# OMNIGENT_ACCOUNTS_COOKIE_SECRET in omnigent-secrets ends sign-ins early. The
# site is only reachable from the tailnet. Defaults to 8.
session_ttl_hours = 168

# How long a command-line sign-in lasts, in days, counted from signing in:
# `omnigent login` on your computers, and `omnigent-mcp login` for your Hermes
# (docs/features/omnigent-mcp.md). They renew their access on their own until
# then. It applies to sign-ins already made, too. Revoking one, with
# `omnigent-mcp logout` or by deleting the account, ends it early; a copied
# token works until then. Defaults to 30.
grant_max_lifetime_days = 365

# Deliberate policy choices.
codex_bypass_approvals = true
claude_bypass_permissions = true
backups_enabled = false
runner_network_policy = "unrestricted"
