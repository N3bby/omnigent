name: Publish immutable images
# Builds and pushes the images without deploying them. Deploy's `release`
# task runs the same build, then locks and deploys the digests.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-images
        with:
          token: ${{ github.token }}
