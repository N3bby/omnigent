name: Deploy
# Runs `mise run deploy` and friends as a short-lived GitHub OIDC identity that
# can only manage the application in the Omnigent namespaces. There are no
# stored credentials. Platform changes still need `mise run bootstrap` from
# your machine; the deploy refuses to run until that is done.
#
# Staged outside .github/workflows until someone who may change workflows
# moves it there.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run against production
        type: choice
        default: diff
        options: [diff, deploy, status, smoke]
permissions:
  contents: read
  id-token: write # OIDC tokens for Tailscale and the Kubernetes API
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  run:
    # The Environment's deployment branch rule and required reviewer are what
    # enforce this; the API server also rejects tokens from other refs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      ENV: production
      INVENTORY: ansible/inventory/production/hosts.yml
    steps:
      # Pinned by SHA: every step can mint the job's OIDC tokens.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:omnigent-ci
      - name: Connect to the Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubeconfig="$RUNNER_TEMP/kubeconfig.json"
          ./scripts/ci-kubeconfig --environment "$ENV" "$kubeconfig"
          echo "OMNIGENT_KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          export OMNIGENT_KUBECONFIG="$kubeconfig"
          # New tailnet nodes take a moment to become reachable.
          for _ in $(seq 1 18); do
            ./scripts/kube auth whoami >/dev/null 2>&1 && break
            sleep 10
          done
          ./scripts/kube auth whoami
      - run: mise run check
      - run: mise run "$TASK"
        env:
          TASK: ${{ inputs.task }}
