# Runner Pods get a user namespace but no delegated cgroup, so containers run
# without cgroups (the Pod's own limits still apply). They use Podman's normal
# bridge networks, so published ports and compose service names work.
[containers]
cgroups = "disabled"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
compose_providers = ["/usr/local/bin/docker-compose"]
compose_warning_logs = false
