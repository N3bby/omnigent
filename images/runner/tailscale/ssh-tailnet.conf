# SSH to tailnet hosts through tailscaled. The Pod has no TUN device, so
# tailscaled uses userspace networking: there's no route to the tailnet and
# no MagicDNS, and `tailscale nc` makes the connection instead.
# WireGuard already authenticates the peer, so new host keys are accepted.

# Full MagicDNS names. `tailscale ip` can't check these, because it looks
# them up in the cluster's DNS.
Match host *.ts.net
    ProxyCommand tailscale nc %h %p
    StrictHostKeyChecking accept-new

# Short names, and 100.x addresses, that are tailnet peers.
Match host *,!*.* exec "tailscale ip -1 %h >/dev/null 2>&1"
    ProxyCommand tailscale nc %h %p
    StrictHostKeyChecking accept-new

Match host 100.* exec "tailscale ip -1 %h >/dev/null 2>&1"
    ProxyCommand tailscale nc %h %p
    StrictHostKeyChecking accept-new
