[tools]
python = "3.13.15"
uv = "0.12.18"
ansible-core = "2.21.4"
kubectl = "1.36.4"

[tasks.check]
description = "Validate configuration, manifests, scripts, and Ansible syntax"
run = './scripts/preflight --environment "${ENV:-production}" --inventory "${INVENTORY:-ansible/inventory/${ENV:-production}/hosts.yml}"'

[tasks.render]
description = "Render the complete non-secret Kubernetes desired state"
run = './scripts/render --environment "${ENV:-production}"'

[tasks.bootstrap]
description = "Provision the VM and the platform as root (needs SSH and sudo)"
run = [
  { task = "check" },
  'ansible-playbook -i "ansible/inventory/${ENV:-production}/hosts.yml" ansible/bootstrap.yml -e "omnigent_environment=${ENV:-production}"',
]

[tasks.diff]
description = "Show the application diff without changing the cluster"
run = [
  { task = "render" },
  './scripts/diff "${ENV:-production}"',
]

[tasks.deploy]
description = "Deploy the application (needs only the Kubernetes API)"
run = [
  { task = "check" },
  './scripts/deploy "${ENV:-production}"',
]

[tasks.status]
description = "Inspect health, capacity, TLS, storage, and runner failures"
run = './scripts/status'

[tasks.smoke]
description = "Run HTTPS and in-cluster health smoke tests"
run = './scripts/smoke-test'

[tasks.lock-images]
description = "Lock the GHCR digests published for the checked-out commit"
run = './scripts/lock-images --environment "${ENV:-production}"'

[tasks.credential-status]
description = "Check credential presence without printing values"
run = './scripts/credential-status'

[tasks.setup-codex]
description = "Run the interactive Codex device OAuth flow on the server"
run = './scripts/setup-codex'

[tasks.setup-claude]
description = "Store or rotate the shared Claude subscription token"
run = './scripts/setup-claude'

[tasks.setup-git-token]
description = "Store or rotate the optional private-Git HTTPS token"
run = './scripts/setup-git-token'

[tasks.setup-cloudflare-token]
description = "Store or rotate the Cloudflare token for DNS-01 certificates"
run = './scripts/setup-cloudflare-token'

[tasks.setup-github-app]
description = "Initialize local credential encryption and configure the GitHub App"
run = './scripts/setup-github-app'

[tasks.test]
description = "Run repository validation and tests"
run = [
  { task = "check" },
  "python -m unittest discover -s tests -v",
]
